name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require CI environment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-cicd-env.mjs --profile=ci --platform=github

      - name: Install
        run: npm ci

      - name: Stamp edge release (read-only check in CI)
        run: npm run check:release-stamp
        continue-on-error: true

      - name: test:ci
        run: npm run test:ci

      - name: CI build (unified marketing + SPA)
        run: npm run build:unified && npm run check:bundle-shipped
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Vercel prebuilt bundle (release branches)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/vercel-ci-deploy.mjs --mode=build --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Upload Vercel prebuilt artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vercel-prebuilt
          path: .vercel/output
          retention-days: 1
          if-no-files-found: error
