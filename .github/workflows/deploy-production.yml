name: Production deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Serialize production deploys — never cancel an in-flight migration + edge rollout.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  gate:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - run: echo "Deploying production @ ${{ env.DEPLOY_SHA }}"

  detect-changes:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.set.outputs.backend }}
      frontend: ${{ steps.set.outputs.frontend }}
      diff_base: ${{ steps.set.outputs.diff_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Resolve diff base
        if: github.event_name != 'workflow_dispatch'
        id: diff
        run: echo "base=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          base: ${{ steps.diff.outputs.base }}
          ref: ${{ env.DEPLOY_SHA }}
          filters: |
            backend:
              - 'supabase/**'
              - 'scripts/stamp-edge-release.mjs'
              - 'scripts/deploy-active-edge-functions.mjs'
              - 'scripts/lib/read-config-toml-functions.mjs'
            frontend:
              - 'src/**'
              - 'apps/**'
              - 'packages/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'vercel.json'
              - 'tailwind.config.ts'
              - 'postcss.config.ts'
              - 'postcss.config.js'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/vercel-ci-deploy.mjs'
              - 'scripts/merge-marketing-dist.mjs'
              - 'scripts/check-marketing-build-env.mjs'

      - name: Set change outputs
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "diff_base=" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
            echo "diff_base=${{ steps.diff.outputs.base }}" >> "$GITHUB_OUTPUT"
          fi

  validate-secrets:
    needs: [gate, detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require full production environment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/check-cicd-env.mjs --profile=production --platform=all

  preflight:
    if: github.event_name == 'workflow_dispatch'
    needs: [gate, detect-changes, validate-secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: CI gate
        run: npm run test:ci

      - name: Production build (unified marketing + SPA)
        run: npm run build:unified
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_VERSION: ${{ env.DEPLOY_SHA }}

      - name: Vercel prebuilt bundle
        run: node scripts/vercel-ci-deploy.mjs --mode=build --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GITHUB_SHA: ${{ env.DEPLOY_SHA }}

      - name: Upload Vercel prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-prebuilt
          path: .vercel/output
          retention-days: 1
          if-no-files-found: error

  deploy-backend:
    needs: [gate, detect-changes, validate-secrets]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install (release stamp)
        run: npm ci

      - name: Stamp edge release (SENTRY_RELEASE parity)
        run: npm run stamp:release

      - name: Link production project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy changed edge functions
        run: |
          if [ -n "${{ needs.detect-changes.outputs.diff_base }}" ]; then
            node scripts/deploy-active-edge-functions.mjs --base="${{ needs.detect-changes.outputs.diff_base }}"
          else
            node scripts/deploy-active-edge-functions.mjs --force-all
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-frontend:
    needs: [gate, detect-changes, validate-secrets, deploy-backend, preflight]
    if: |
      always() &&
      needs.detect-changes.outputs.frontend == 'true' &&
      needs.validate-secrets.result == 'success' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download Vercel prebuilt artifact (from CI)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: vercel-prebuilt
          path: .vercel/output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download Vercel prebuilt artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: vercel-prebuilt
          path: .vercel/output

      - name: Deploy Vercel production
        id: vercel
        run: node scripts/vercel-ci-deploy.mjs --mode=deploy --environment=production --skip-build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GITHUB_SHA: ${{ env.DEPLOY_SHA }}

      - name: Deployment URL
        if: steps.vercel.outputs.url != ''
        run: echo "Production frontend → ${{ steps.vercel.outputs.url }}"
