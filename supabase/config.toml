# Neutral local project identifier for Supabase CLI state and Docker resources.
# This is intentionally not a remote staging/prod ref:
# - the app uses `VITE_SUPABASE_*`
# - remote CLI work uses explicit project refs or target-specific scripts
project_id = "holzen"

# Holzen pins a non-default local port block to avoid Windows excluded-port
# conflicts that commonly affect the Supabase CLI defaults in the 5432x range.
[api]
port = 55421

[db]
port = 55422
shadow_port = 55420

  [db.pooler]
  port = 55429

[studio]
port = 55423

[inbucket]
port = 55424
smtp_port = 55425
pop3_port = 55426

[analytics]
port = 55427
vector_port = 55428

# Local Google OAuth — set SUPABASE_AUTH_EXTERNAL_GOOGLE_* in supabase/.env.local
# See docs/ops/local-google-oauth.md (Google redirect: http://127.0.0.1:55421/auth/v1/callback)
[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:8080",
  "http://localhost:8080/**",
  "http://127.0.0.1:8080",
  "http://127.0.0.1:8080/**",
]

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://127.0.0.1:55421/auth/v1/callback"
skip_nonce_check = true

